{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "monoscope.fullname" . }}
  labels:
    {{- include "monoscope.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "monoscope.fullname" . }}
          port: {{ .Values.service.httpPort }}
---
{{- end }}
{{- if .Values.gateway.grpc.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ include "monoscope.fullname" . }}-grpc
  labels:
    {{- include "monoscope.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.grpc.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.grpc.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "monoscope.fullname" . }}
          port: {{ .Values.service.grpcPort }}
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "monoscope.fullname" . }}
  labels:
    {{- include "monoscope.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "monoscope.fullname" . }}
                port:
                  number: {{ .Values.service.httpPort }}
{{- end }}
