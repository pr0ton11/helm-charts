apiVersion: v2
name: stalwart
description: "Helm chart for the Stalwart mail and collaboration server"
home: https://stalw.art
type: application
version: 0.9.0
# renovate: datasource=docker depName=stalwartlabs/stalwart
appVersion: v1.0.0
keywords:
  - mail
  - smtp
  - imap
  - jmap
  - stalwart
sources:
  - https://github.com/stalwartlabs/stalwart
  - https://github.com/kgrubb/stalwart-helm-chart
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |-
    - kind: changed
      description: Default to Stalwart v1.0.0, which requires migration from a pre-1.0 database
    - kind: added
      description: Support existing environment Secrets with extraEnvFrom
  artifacthub.io/links: |-
    - name: App Source
      url: https://github.com/stalwartlabs/stalwart
    - name: Documentation
      url: https://stalw.art/docs/cluster/orchestration/kubernetes/
    - name: Upstream Chart
      url: https://github.com/kgrubb/stalwart-helm-chart
    - name: Chart Source
      url: https://github.com/pr0ton11/helm-charts/tree/main/charts/stalwart
