{{- if and (eq .Values.queryLog.type "sqlite") (not .Values.queryLog.sqlite.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "blocky.fullname" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.queryLog.sqlite.storageClassName nil }}
  storageClassName: {{ .Values.queryLog.sqlite.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.queryLog.sqlite.size | quote }}
{{- end }}
