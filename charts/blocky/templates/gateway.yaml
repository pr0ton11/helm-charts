{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentRefs }}
{{- fail "gateway.parentRefs is required for HTTPRoute" }}
{{- end }}
{{- if not .Values.gateway.hostnames }}
{{- fail "gateway.hostnames is required for HTTPRoute" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "blocky.fullname" . }}
  labels:
    {{- include "blocky.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- .Values.gateway.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- .Values.gateway.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      {{- if .Values.gateway.advertiseHTTP3 }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=3600'
      {{- end }}
      backendRefs:
        - name: {{ include "blocky.fullname" . }}
          port: 4000
{{- end }}
