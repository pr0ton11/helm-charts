service:
  # -- Configures the Grist service.
  # @default -- See [values.yaml](./values.yaml)
  main:
    ports:
      http:
        port: 8484

ingress:
  # -- Enable and configure Kubernetes Ingress.
  # @default -- See [values.yaml](./values.yaml)
  main:
    enabled: false
    annotations: {}
    # hosts:
    #   - host: grist.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # tls:
    #   - secretName: grist-example-tls
    #     hosts:
    #       - grist.example.com

gateway:
  # -- Enable and configure Gateway API HTTPRoute.
  # @default -- See [values.yaml](./values.yaml)
  main:
    enabled: false
    protocol: https
    annotations: {}
    labels: {}
    # parentRefs:
    #   - name: gateway
    #     namespace: gateway-system
    #     sectionName: https
    # hostnames:
    #   - grist.example.com
    # hosts:
    #   - host: grist.example.com
    #     paths:
    #       - path: /
    #         pathType: PathPrefix

# -- Persistent storage mounted at /persist. Upstream requires this for
# documents, the SQLite home database, sessions, and instance configuration.
# @default -- See [values.yaml](./values.yaml)
persistence:
  data:
    enabled: true
    retain: true
    mountPath: /persist
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi

# -- Optional chart-managed Redis. It stores sessions and state and is required
# for webhooks and notifications and recommended for snapshots.
# @default -- See [values.yaml](./values.yaml)
redis:
  enabled: false
  image:
    repository: docker.io/library/redis
    tag: 8.10.0-alpine
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # password: ""
    # existingSecret: grist-redis
    # existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: false
      retain: true
      # storageClass: ""
      # accessMode: ReadWriteOnce
      # size: 1Gi
