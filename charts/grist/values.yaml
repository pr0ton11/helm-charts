#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s common library chart. Additional common
# chart values can be configured alongside the values documented here:
# https://github.com/bjw-s-labs/helm-charts/blob/a081de5/charts/library/common/values.yaml
#

global: {}

image:
  # -- Image repository
  repository: docker.io/gristlabs/grist
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag
  tag: 1.7.17

# -- Number of Grist replicas. The default SQLite databases and ReadWriteOnce
# persistence require a single replica.
replicaCount: 1

# -- Grist container resource requests. Upstream reports 2 CPU and 8 GiB RAM
# as a known-good moderate-workload size; tune requests and optional limits for
# your documents and concurrency.
# @default -- See [values.yaml](./values.yaml)
resources:
  requests:
    cpu: 500m
    memory: 1Gi

# -- Secrets and ConfigMaps to load as environment variables. When this is
# non-empty, required-variable validation is skipped because Helm cannot inspect
# the referenced objects. Explicit `env` entries take precedence over envFrom.
# @default -- See [values.yaml](./values.yaml)
envFrom: []
  # - secret: grist-env
  # - configMap: grist-env

# -- Grist environment variables.
# Values may be strings or Kubernetes `valueFrom` references, for example:
# GRIST_SESSION_SECRET:
#   secretKeyRef:
#     name: grist-env
#     key: GRIST_SESSION_SECRET
#
# Main reference:
# https://github.com/gristlabs/grist-core/blob/v1.7.17/README.md#environment-variables
# @default -- See [values.yaml](./values.yaml)
env:
  # Required session-signing secret. Existing installations must retain it.
  GRIST_SESSION_SECRET: ""

  # Installation owner. Change this before completing first-run setup.
  GRIST_DEFAULT_EMAIL: you@example.com

  # Capability-free sandbox that works on amd64 and arm64. Upstream recommends
  # gVisor when compatible x86 hardware and SYS_PTRACE are available.
  GRIST_SANDBOX_FLAVOR: pyodide

  # Privacy and outbound version checks.
  GRIST_TELEMETRY_LEVEL: "off"
  GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING: "false"

  # Public base URL. The chart derives this when Ingress or Gateway API is
  # enabled. PORT is derived from service.main.ports.http.port.
  APP_HOME_URL: ""
  # APP_HOME_INTERNAL_URL: ""
  # APP_DOC_URL: ""
  # APP_DOC_INTERNAL_URL: ""
  # APP_STATIC_URL: ""
  # APP_STATIC_INCLUDE_CUSTOM_CSS: "false"
  # APP_UNTRUSTED_URL: ""
  # HOME_PORT: ""
  # GRIST_UNTRUSTED_PORT: ""
  # GRIST_ROUTER_URL: ""
  # GRIST_MANAGED_WORKERS: "false"
  # GRIST_ID_PREFIX: ""

  # Installation and site behavior.
  # GRIST_BOOT_KEY: ""
  # GRIST_IN_SERVICE: "false"
  # GRIST_SINGLE_ORG: ""
  # GRIST_TEMPLATE_ORG: ""
  # GRIST_INSTALL_ADMIN_ORG: ""
  # GRIST_ORG_IN_PATH: "true"
  # GRIST_FORCE_LOGIN: "false"
  # GRIST_ANON_PLAYGROUND: "true"
  # GRIST_PERSONAL_ORGS: "true"
  # GRIST_ORG_CREATION_ANYONE: "true"
