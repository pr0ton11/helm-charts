#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/bjw-s-labs/helm-charts/blob/a081de5/charts/library/common/values.yaml
#

global: {}

image:
  # -- Image repository
  repository: ghcr.io/paperless-ngx/paperless-ngx
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag
  tag: 3.0.5

# -- Environment variables [[ref]](https://docs.paperless-ngx.com/configuration/)
# @default -- See [values.yaml](./values.yaml)
env:
  # -- Set the container timezone
  TZ: UTC
  # Paperless-ngx v3 requires PAPERLESS_SECRET_KEY.
  # Generate a new key with:
  # python3 -c "import secrets; print(secrets.token_urlsafe(64))"
  # Existing installations may keep their previous key to preserve sessions and signed tokens.
  # PAPERLESS_SECRET_KEY: ""
  # Or reference an existing Kubernetes Secret:
  # PAPERLESS_SECRET_KEY:
  #   secretKeyRef:
  #     name: paperless-secret
  #     key: PAPERLESS_SECRET_KEY

service:
  # -- Configures service settings for the chart.
  # @default -- See [values.yaml](./values.yaml)
  main:
    ports:
      http:
        port: 8000

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  main:
    enabled: false
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
    # hosts:
    #   - host: chart-example.local
    #     paths:
    #       - path: /
    # tls:
    #   - secretName: chart-example.local
    #     hosts:
    #       - chart-example.local

gateway:
  # -- Enable and configure Gateway API HTTPRoute settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  main:
    enabled: false
    # -- Scheme used when the chart derives PAPERLESS_URL from the Gateway API host.
    protocol: https
    annotations: {}
    labels: {}
    # parentRefs:
    #   - name: gateway
    #     namespace: gateway-system
    #     sectionName: https
    # hostnames:
    #   - chart-example.local
    # hosts:
    #   - host: chart-example.local
    #     paths:
    #       - path: /
    #         pathType: PathPrefix

persistence:
  # -- Configure data volume settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  data:
    enabled: false
    retain: true
    mountPath: /usr/src/paperless/data
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  # -- Configure media volume settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  media:
    enabled: false
    retain: true
    mountPath: /usr/src/paperless/media
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 8Gi
  # -- Configure export volume settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  export:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/export
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  # -- Configure consume volume settings for the chart under this key.
  # @default -- See [values.yaml](./values.yaml)
  consume:
    enabled: true
    retain: true
    mountPath: /usr/src/paperless/consume
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 4Gi

# -- Enable and configure the optional PostgreSQL subchart under this key.
#    Leave this disabled when using an external PostgreSQL server and configure
#    Paperless database settings directly under `env`, for example:
#    PAPERLESS_DBENGINE, PAPERLESS_DBHOST, PAPERLESS_DBNAME, PAPERLESS_DBUSER,
#    PAPERLESS_DBPASS, and PAPERLESS_DB_OPTIONS.
#    If enabled, the chart will inject the app's db envs for the bundled
#    PostgreSQL instance.
#    [[ref]](https://github.com/bitnami/charts/tree/main/bitnami/postgresql)
# @default -- See [values.yaml](./values.yaml)
postgresql:
  enabled: false
  auth:
    database: paperless
    postgresPassword: changeme
  primary:
    persistence:
      enabled: false
      # storageClass: ""
      # size: 8Gi

# -- Enable and configure mariadb database subchart under this key.
#    If enabled, the app's db envs will be set for you.
#    [[ref]](https://github.com/bitnami/charts/tree/main/bitnami/mariadb)
# @default -- See [values.yaml](./values.yaml)
mariadb:
  enabled: false
  auth:
    database: paperless
    username: paperless
    password: changeme
    rootPassword: changeme
  primary:
    persistence:
      enabled: false
      # storageClass: ""
      # size: 8Gi

# -- Enable and configure chart-managed Redis under this key.
#    If enabled, the app's Redis env will be set for you.
# @default -- See [values.yaml](./values.yaml)
redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9.1.2-alpine
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    username: ""
    # password: ""
    # Use an existing secret for redis auth. Do this if you're using Argo to manage your instance or otherwise using helm template under the hood
    #     The secret name can vary, but the password key must be redis-password.
    # existingSecret: paperless-redis
    # existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: false
      # storageClass: ""
      # accessMode: ReadWriteOnce
      # size: 1Gi
  replica:
    replicaCount: 0
