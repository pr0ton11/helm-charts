apiVersion: v2
name: paperless-ngx
description: "A community-supported supercharged version of paperless: scan, index and archive all your physical documents"
home: https://github.com/paperless-ngx/paperless-ngx
icon: https://raw.githubusercontent.com/paperless-ngx/paperless-ngx/b948750/src-ui/src/assets/logo-notext.svg
type: application
version: 0.28.1
# renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
appVersion: 3.0.5
kubeVersion: ">=1.22.0-0"
keywords:
  - documents
  - ocr
  - paper
dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.0.1
  - name: postgresql
    version: 18.8.7
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mariadb
    version: 27.0.8
    repository: https://charts.bitnami.com/bitnami
    condition: mariadb.enabled
sources:
  - https://github.com/paperless-ngx/paperless-ngx
annotations:
  artifacthub.io/alternativeName: paperless
  artifacthub.io/changes: |-
    - kind: changed
      description: Update Paperless-ngx to the stable 3.0.4 release
    - kind: changed
      description: Restore the image pull policy to IfNotPresent for the fixed release tag
    - kind: changed
      description: Update the bundled PostgreSQL chart to 18.8.5
    - kind: changed
      description: Update the bundled MariaDB chart to 27.0.1
    - kind: changed
      description: Update the bundled Valkey image to 9.1.1-alpine
  artifacthub.io/links: |-
    - name: App Source
      url: https://github.com/paperless-ngx/paperless-ngx
    - name: Chart Source
      url: https://github.com/pr0ton11/helm-charts/tree/main/charts/paperless-ngx
