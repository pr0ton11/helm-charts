{{- if .Values.ingressDiscovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mediumauth.discoveryRoleName" . }}
  labels:
    {{- include "mediumauth.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mediumauth.discoveryRoleName" . }}
  labels:
    {{- include "mediumauth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mediumauth.discoveryRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mediumauth.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
