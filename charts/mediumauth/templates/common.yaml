{{/* Validate required chart values. */}}
{{- define "mediumauth.validateValues" -}}
{{- $inlineKey := trim (.Values.configEncryptionKey.value | default "") -}}
{{- $existingSecret := trim (.Values.configEncryptionKey.existingSecret | default "") -}}
{{- if and $inlineKey $existingSecret -}}
  {{- fail "Configure only one of configEncryptionKey.value or configEncryptionKey.existingSecret" -}}
{{- end -}}
{{- if and (not $inlineKey) (not $existingSecret) -}}
  {{- fail "Mediumauth requires configEncryptionKey.value or configEncryptionKey.existingSecret" -}}
{{- end -}}
{{- if $inlineKey -}}
  {{- if not (regexMatch "^[A-Za-z0-9+/]{43}=$" $inlineKey) -}}
    {{- fail "configEncryptionKey.value must be standard base64 encoding of exactly 32 bytes" -}}
  {{- end -}}
  {{- if ne (len (b64dec $inlineKey)) 32 -}}
    {{- fail "configEncryptionKey.value must decode to exactly 32 bytes" -}}
  {{- end -}}
{{- end -}}
{{- if and $existingSecret (empty .Values.configEncryptionKey.existingSecretKey) -}}
  {{- fail "configEncryptionKey.existingSecretKey is required with configEncryptionKey.existingSecret" -}}
{{- end -}}
{{- if and (hasKey .Values.env "TINYAUTH_CONFIG_ENCRYPTION_KEY") (not (empty (get .Values.env "TINYAUTH_CONFIG_ENCRYPTION_KEY"))) -}}
  {{- fail "Set the current key through configEncryptionKey instead of env.TINYAUTH_CONFIG_ENCRYPTION_KEY" -}}
{{- end -}}
{{- if and (hasKey .Values.env "TINYAUTH_CONFIG_NEW_ENCRYPTION_KEY") (not (empty (get .Values.env "TINYAUTH_CONFIG_NEW_ENCRYPTION_KEY"))) -}}
  {{- fail "Do not set TINYAUTH_CONFIG_NEW_ENCRYPTION_KEY in the Mediumauth Deployment. Use it only with the offline rotate-key command" -}}
{{- end -}}
{{- $databaseDriver := "sqlite" -}}
{{- if and (hasKey .Values.env "TINYAUTH_DATABASE_DRIVER") (not (empty (get .Values.env "TINYAUTH_DATABASE_DRIVER"))) -}}
  {{- $configuredDriver := get .Values.env "TINYAUTH_DATABASE_DRIVER" -}}
  {{- if kindIs "string" $configuredDriver -}}
    {{- $databaseDriver = lower $configuredDriver -}}
  {{- else if or (not .Values.persistence.data.enabled) (gt (int .Values.replicaCount) 1) -}}
    {{- fail "Set env.TINYAUTH_DATABASE_DRIVER to the literal string postgres before disabling persistence or using multiple replicas" -}}
  {{- end -}}
{{- end -}}
{{- if and (not .Values.persistence.data.enabled) (ne $databaseDriver "postgres") -}}
  {{- fail "SQLite requires persistence.data.enabled=true. Only an explicit PostgreSQL deployment can disable it" -}}
{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (ne $databaseDriver "postgres") -}}
  {{- fail "replicaCount greater than 1 requires a shared PostgreSQL database" -}}
{{- end -}}
{{- if not .Values.envFrom -}}
  {{- if or (not (hasKey .Values.env "TINYAUTH_AUTH_USERS")) (empty (get .Values.env "TINYAUTH_AUTH_USERS")) -}}
    {{- fail "Mediumauth requires env.TINYAUTH_AUTH_USERS or an envFrom source containing a bootstrap administrator" -}}
  {{- end -}}
{{- end -}}
{{- end -}}

{{/* Values owned by the chart rather than the upstream application. */}}
{{- define "mediumauth.hardcodedValues" -}}
env:
  TINYAUTH_CONFIG_ENCRYPTION_KEY:
    secretKeyRef:
      name: {{ include "mediumauth.configEncryptionSecretName" . }}
      key: {{ include "mediumauth.configEncryptionSecretKey" . }}
  TINYAUTH_SERVER_PORT: {{ quote .Values.service.main.ports.http.port }}
  TINYAUTH_SERVER_ADDRESS: "0.0.0.0"
  {{- if .Values.ingressDiscovery.enabled }}
  TINYAUTH_LABELPROVIDER: kubernetes
  {{- else }}
  TINYAUTH_LABELPROVIDER: none
  {{- end }}

  {{- $hasConfiguredURL := and (hasKey .Values.env "TINYAUTH_APPURL") (not (empty (get .Values.env "TINYAUTH_APPURL"))) -}}
  {{- if not $hasConfiguredURL }}
  {{- $appURL := "" -}}
  {{- with .Values.gateway.main }}
  {{- if .enabled }}
  {{- $host := "" -}}
  {{- if .hosts }}
  {{- $host = (first .hosts).host -}}
  {{- else if .hostnames }}
  {{- $host = first .hostnames -}}
  {{- end }}
  {{- if $host }}
  {{- $appURL = printf "%s://%s" (.protocol | default "https") $host -}}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if not $appURL }}
  {{- with .Values.ingress.main }}
  {{- if and .enabled .hosts }}
  {{- $appURL = printf "http%s://%s" (ternary "s" "" (not (empty .tls))) (first .hosts).host -}}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $appURL }}
  TINYAUTH_APPURL: {{ $appURL }}
  {{- end }}
  {{- end }}
{{- end -}}

{{- define "mediumauth.commonValues" -}}
{{- $configuredEnv := dict -}}
{{- range $name, $value := .Values.env -}}
  {{- if or (not (kindIs "string" $value)) (ne $value "") -}}
    {{- $_ := set $configuredEnv $name $value -}}
  {{- end -}}
{{- end -}}
controllers:
  main:
    type: deployment
    replicas: {{ .Values.replicaCount }}
    strategy: Recreate
    serviceAccount:
      identifier: main
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      main:
        image:
          repository: {{ .Values.image.repository }}
          tag: {{ .Values.image.tag }}
          pullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- toYaml (mergeOverwrite $configuredEnv ((include "mediumauth.hardcodedValues" . | fromYaml).env)) | nindent 10 }}
        {{- with .Values.envFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
          - name: http
            containerPort: {{ .Values.service.main.ports.http.port }}
            protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/healthz
            port: http
            spec:
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /api/readyz
            port: http
            spec:
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 6
          startup:
            enabled: true
            type: HTTP
            path: /api/readyz
            port: http
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 30
serviceAccount:
  main:
    enabled: true
    forceRename: {{ include "mediumauth.fullname" . }}
service:
  main:
    controller: main
    ports:
      http:
        targetPort: http
{{- with .Values.persistence }}
persistence:
  {{- range $name, $config := . }}
  {{- if and (kindIs "map" $config) $config.mountPath }}
  {{ $name }}:
    globalMounts:
      - path: {{ $config.mountPath }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end -}}

{{- include "mediumauth.validateValues" . -}}
{{- $_ := mergeOverwrite .Values (include "mediumauth.commonValues" . | fromYaml) -}}

{{/* Render the common library templates. */}}
{{ include "bjw-s.common.loader.all" . }}
