name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  charts:
    name: Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts

      - name: Build Paperless-ngx dependencies
        run: helm dependency build charts/paperless-ngx

      - name: Build Documenso dependencies
        run: helm dependency build charts/documenso

      - name: Build Grist dependencies
        run: helm dependency build charts/grist

      - name: Build Mediumauth dependencies
        run: helm dependency build charts/mediumauth

      - name: Lint Paperless-ngx
        run: helm lint charts/paperless-ngx --set 'env.PAPERLESS_SECRET_KEY=ci-secret-key'

      - name: Reject missing Paperless secret key
        run: |
          if helm template paperless-ngx charts/paperless-ngx; then
            echo "Expected helm template to fail without env.PAPERLESS_SECRET_KEY"
            exit 1
          fi

      - name: Lint Documenso
        run: helm lint charts/documenso --values .github/fixtures/documenso-values.yaml

      - name: Reject missing Documenso environment
        run: |
          if helm template documenso charts/documenso; then
            echo "Expected helm template to fail without the required Documenso environment"
            exit 1
          fi

      - name: Reject short Documenso secrets
        run: |
          if helm template documenso charts/documenso \
            --values .github/fixtures/documenso-values.yaml \
            --set-string 'env.NEXTAUTH_SECRET=short'; then
            echo "Expected helm template to reject a short NEXTAUTH_SECRET"
            exit 1
          fi

      - name: Render Documenso external database values
        run: helm template documenso charts/documenso --values .github/fixtures/documenso-values.yaml

      - name: Preserve explicit Documenso public URL
        run: |
          helm template documenso charts/documenso \
            --values .github/fixtures/documenso-values.yaml \
            --set 'ingress.main.enabled=true' \
            --set 'ingress.main.hosts[0].host=route.example.invalid' \
            --set 'ingress.main.hosts[0].paths[0].path=/' \
            --set 'ingress.main.hosts[0].paths[0].pathType=Prefix' \
            | grep -F 'value: https://sign.example.invalid'

      - name: Render Documenso environment Secret
        run: helm template documenso charts/documenso --set 'envFrom[0].secret=documenso-env'

      - name: Render Documenso bundled dependencies
        run: >-
          helm template documenso charts/documenso
          --values .github/fixtures/documenso-values.yaml
          --set-string 'env.NEXT_PRIVATE_DATABASE_URL='
          --set 'postgresql.enabled=true'
          --set 'redis.enabled=true'
          --set-string 'signingCertificate.existingSecret=documenso-signing'

      - name: Render Documenso ingress values
        run: >-
          helm template documenso charts/documenso
          --values .github/fixtures/documenso-values.yaml
          --set-string 'env.NEXT_PUBLIC_WEBAPP_URL='
          --set 'ingress.main.enabled=true'
          --set 'ingress.main.hosts[0].host=sign.example.invalid'
          --set 'ingress.main.hosts[0].paths[0].path=/'
          --set 'ingress.main.hosts[0].paths[0].pathType=Prefix'

      - name: Render Documenso Gateway API values
        run: >-
          helm template documenso charts/documenso
          --values .github/fixtures/documenso-values.yaml
          --api-versions gateway.networking.k8s.io/v1/HTTPRoute
          --set-string 'env.NEXT_PUBLIC_WEBAPP_URL='
          --set 'gateway.main.enabled=true'
          --set 'gateway.main.parentRefs[0].name=public'
          --set 'gateway.main.parentRefs[0].namespace=gateway-system'
          --set 'gateway.main.parentRefs[0].sectionName=https'
          --set 'gateway.main.hosts[0].host=sign.example.invalid'
          --set 'gateway.main.hosts[0].paths[0].path=/'
          --set 'gateway.main.hosts[0].paths[0].pathType=PathPrefix'

      - name: Lint Grist
        run: helm lint charts/grist --values .github/fixtures/grist-values.yaml

      - name: Reject missing Grist session secret
        run: |
          if helm template grist charts/grist; then
            echo "Expected helm template to fail without env.GRIST_SESSION_SECRET"
            exit 1
          fi

      - name: Reject unsafe Grist storage topology
        run: |
          if helm template grist charts/grist \
            --values .github/fixtures/grist-values.yaml \
            --set 'replicaCount=2'; then
            echo "Expected the monolith chart to reject multiple replicas"
            exit 1
          fi
          if helm template grist charts/grist \
            --values .github/fixtures/grist-values.yaml \
            --set 'persistence.data.enabled=false'; then
            echo "Expected the chart to require durable /persist storage"
            exit 1
          fi

      - name: Render Grist default values
        run: helm template grist charts/grist --values .github/fixtures/grist-values.yaml

      - name: Render Grist external PostgreSQL values
        run: >-
          helm template grist charts/grist
          --values .github/fixtures/grist-values.yaml
          --set 'env.TYPEORM_TYPE=postgres'
          --set 'env.TYPEORM_DATABASE=grist'
          --set 'env.TYPEORM_USERNAME=grist'
          --set 'env.TYPEORM_HOST=postgres.example.invalid'
          --set 'env.TYPEORM_PORT=5432'
          --set 'env.TYPEORM_PASSWORD.secretKeyRef.name=grist-postgresql'
          --set 'env.TYPEORM_PASSWORD.secretKeyRef.key=password'

      - name: Preserve explicit Grist public URL
        run: |
          helm template grist charts/grist \
            --values .github/fixtures/grist-values.yaml \
            --set 'ingress.main.enabled=true' \
            --set 'ingress.main.hosts[0].host=route.example.invalid' \
            --set 'ingress.main.hosts[0].paths[0].path=/' \
            --set 'ingress.main.hosts[0].paths[0].pathType=Prefix' \
            | grep -F 'value: https://grist.example.invalid'

      - name: Render Grist environment Secret
        run: helm template grist charts/grist --set 'envFrom[0].secret=grist-env'

      - name: Render Grist chart-managed Redis
        run: >-
          helm template grist charts/grist
          --values .github/fixtures/grist-values.yaml
          --set 'redis.enabled=true'

      - name: Render Grist existing Redis Secret
        run: >-
          helm template grist charts/grist
          --values .github/fixtures/grist-values.yaml
          --set 'redis.enabled=true'
          --set 'redis.auth.existingSecret=grist-redis-existing'

      - name: Render Grist ingress values
        run: >-
          helm template grist charts/grist
          --values .github/fixtures/grist-values.yaml
          --set-string 'env.APP_HOME_URL='
          --set 'ingress.main.enabled=true'
          --set 'ingress.main.hosts[0].host=grist.example.invalid'
          --set 'ingress.main.hosts[0].paths[0].path=/'
          --set 'ingress.main.hosts[0].paths[0].pathType=Prefix'

      - name: Render Grist Gateway API values
        run: >-
          helm template grist charts/grist
          --values .github/fixtures/grist-values.yaml
          --api-versions gateway.networking.k8s.io/v1/HTTPRoute
          --set-string 'env.APP_HOME_URL='
          --set 'gateway.main.enabled=true'
          --set 'gateway.main.parentRefs[0].name=public'
          --set 'gateway.main.parentRefs[0].namespace=gateway-system'
          --set 'gateway.main.parentRefs[0].sectionName=https'
          --set 'gateway.main.hosts[0].host=grist.example.invalid'
          --set 'gateway.main.hosts[0].paths[0].path=/'
          --set 'gateway.main.hosts[0].paths[0].pathType=PathPrefix'

      - name: Lint Mediumauth
        run: helm lint charts/mediumauth --values .github/fixtures/mediumauth-values.yaml

      - name: Run Mediumauth chart tests
        run: charts/mediumauth/tests/template_test.sh

      - name: Render Paperless-ngx default values
        run: helm template paperless-ngx charts/paperless-ngx --set 'env.PAPERLESS_SECRET_KEY=ci-secret-key'

      - name: Render Paperless-ngx ingress values
        run: >-
          helm template paperless-ms charts/paperless-ngx
          --set 'env.PAPERLESS_SECRET_KEY=ci-secret-key'
          --set 'ingress.main.enabled=true'
          --set 'ingress.main.hosts[0].host=paperless.example.invalid'
          --set 'ingress.main.hosts[0].paths[0].path=/'
          --set 'ingress.main.hosts[0].paths[0].pathType=Prefix'

      - name: Render Paperless-ngx Gateway API values
        run: >-
          helm template paperless-ms charts/paperless-ngx
          --api-versions gateway.networking.k8s.io/v1/HTTPRoute
          --set 'env.PAPERLESS_SECRET_KEY=ci-secret-key'
          --set 'ingress.main.enabled=false'
          --set 'gateway.main.enabled=true'
          --set 'gateway.main.parentRefs[0].name=public'
          --set 'gateway.main.parentRefs[0].namespace=gateway-system'
          --set 'gateway.main.parentRefs[0].sectionName=https'
          --set 'gateway.main.hosts[0].host=paperless.example.invalid'
          --set 'gateway.main.hosts[0].paths[0].path=/'
          --set 'gateway.main.hosts[0].paths[0].pathType=PathPrefix'
