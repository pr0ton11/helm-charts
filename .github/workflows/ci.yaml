name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  charts:
    name: Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts

      - name: Build dependencies
        run: helm dependency build charts/paperless-ngx

      - name: Lint
        run: helm lint charts/paperless-ngx

      - name: Render default values
        run: helm template paperless-ngx charts/paperless-ngx

      - name: Render ingress values
        run: >-
          helm template paperless-ms charts/paperless-ngx
          --set 'ingress.main.enabled=true'
          --set 'ingress.main.hosts[0].host=paperless.example.invalid'
          --set 'ingress.main.hosts[0].paths[0].path=/'
          --set 'ingress.main.hosts[0].paths[0].pathType=Prefix'

      - name: Render Gateway API values
        run: >-
          helm template paperless-ms charts/paperless-ngx
          --api-versions gateway.networking.k8s.io/v1/HTTPRoute
          --set 'ingress.main.enabled=false'
          --set 'gateway.main.enabled=true'
          --set 'gateway.main.parentRefs[0].name=public'
          --set 'gateway.main.parentRefs[0].namespace=gateway-system'
          --set 'gateway.main.parentRefs[0].sectionName=https'
          --set 'gateway.main.hosts[0].host=paperless.example.invalid'
          --set 'gateway.main.hosts[0].paths[0].path=/'
          --set 'gateway.main.hosts[0].paths[0].pathType=PathPrefix'
