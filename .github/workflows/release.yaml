name: Release

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/release.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  oci:
    name: Publish OCI Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts

      - name: Build dependencies
        run: helm dependency build charts/paperless-ngx

      - name: Lint
        run: helm lint charts/paperless-ngx --set 'env.PAPERLESS_SECRET_KEY=ci-secret-key'

      - name: Package
        run: helm package charts/paperless-ngx --destination .dist

      - name: Login to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push OCI chart
        run: helm push .dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
